<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projecten | Mijn Bureau</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Fira Sans", "Segoe UI", Arial, sans-serif;
        --lintblauw: #154273;
        --hemelblauw: #007bc7;
        --cool-grey: #0f172a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--cool-grey);
        background: #f1f5f9;
      }
      header {
        padding: 24px;
        color: #fff;
        background: var(--lintblauw);
        border-bottom: 4px solid var(--hemelblauw);
      }
      main {
        max-width: 720px;
        margin: 48px auto;
        padding: 0 24px;
      }
      .card {
        padding: 32px;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-top: 4px solid var(--lintblauw);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <header><strong>Mijn Bureau</strong></header>
    <main>
      <section class="card">
        <h1>Projecten</h1>
        <p>
          Deze projectapplicatie is nog niet aangesloten. Configureer
          <code>PROJECTS_URL</code> om hier de echte projectomgeving te openen.
        </p>
      </section>
    </main>
  </body>
</html>
